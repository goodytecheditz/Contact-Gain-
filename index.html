<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goody Tech Contact Gain</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0f19; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #161f32; border: 1px solid #23314d; width: 100%; max-width: 420px; padding: 32px 24px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); text-align: center; }
        .logo { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; margin-bottom: 16px; border: 2px solid #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); background: #0b0f19; }
        .badge { background: rgba(37, 211, 102, 0.15); color: #25d366; font-size: 11px; font-weight: bold; padding: 5px 12px; border-radius: 20px; display: inline-block; margin-bottom: 15px; border: 1px solid rgba(37, 211, 102, 0.3); letter-spacing: 0.5px; }
        h1 { font-size: 22px; color: #ffffff; margin-bottom: 8px; font-weight: 800; letter-spacing: -0.5px; text-transform: uppercase; }
        p { font-size: 13px; color: #94a3b8; margin-bottom: 25px; line-height: 1.5; }
        .form-group { text-align: left; margin-bottom: 18px; }
        label { font-size: 11px; color: #cbd5e1; font-weight: 700; display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 14px 16px; background: #0b0f19; border: 1.5px solid #283754; border-radius: 12px; color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: #25d366; box-shadow: 0 0 10px rgba(37, 211, 102, 0.2); }
        button { width: 100%; padding: 16px; background: #25d366; border: none; border-radius: 12px; color: #000000; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 10px; transition: 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
        button:hover { background: #20bd5a; }
        #success-msg { display: none; color: #25d366; font-size: 14px; font-weight: bold; margin-top: 15px; line-height: 1.6; background: rgba(37, 211, 102, 0.1); padding: 20px; border-radius: 12px; border: 1px solid rgba(37, 211, 102, 0.3); }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://raw.githubusercontent.com/goodytecheditz/Contact-Gain/main/file_0000000040b081fd9280dc68bb62c1ef.png" alt="Goody Tech Logo" class="logo">
        <br>
        <span class="badge">OFFICIAL NETWORK</span>
        <h1>GOODY TECH CONTACT GAIN</h1>
        <p>Submit your details below to join our active contact list and boost your WhatsApp status views instantly!</p>
        
        <form id="form" method="POST">
            <input type="hidden" name="access_key" value="a60417c5-aab6-4907-a8c9-dde6901afffb">
            <input type="hidden" name="subject" value="New Goody Tech Contact Gain Submission">
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="Full Name" placeholder="e.g. John Doe" required>
            </div>
            
            <div class="form-group">
                <label>WhatsApp Number</label>
                <input type="tel" name="WhatsApp Number" placeholder="e.g. 08012345678" required>
            </div>
            
            <button type="submit" id="submitBtn">SUBMIT DETAILS 🚀</button>
        </form>

        <div id="success-msg">
            🎉 Successfully Submitted!<br>Your details have been saved securely to the Goody Tech network.
        </div>
    </div>

    <script>
        const form = document.getElementById('form');
        const successMsg = document.getElementById('success-msg');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            submitBtn.textContent = "SUBMITTING...";
            
            const formData = new FormData(form);
            const object = Object.fromEntries(formData);
            const json = JSON.stringify(object);

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: json
            })
            .then(async (response) => {
                let jsonResponse = await response.json();
                if (response.status == 200) {
                    form.style.display = 'none';
                    successMsg.style.display = 'block';
                } else {
                    alert(jsonResponse.message);
                    submitBtn.textContent = "SUBMIT DETAILS 🚀";
                }
            })
            .catch(error => {
                alert("Something went wrong! Please try again.");
                submitBtn.textContent = "SUBMIT DETAILS 🚀";
            });
        });
    </script>
</body>
</html>
